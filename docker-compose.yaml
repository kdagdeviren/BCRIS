version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bcris
      POSTGRES_USER: bcris_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcris_user -d bcris"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bcris_network

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Django Settings
      DJANGO_SETTINGS_MODULE: bcris_project.settings_production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-please-change-this-secret-key-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      
      # Database - Otomatik yapılandırma
      DATABASE_URL: postgresql://bcris_user:${POSTGRES_PASSWORD:-changeme123}@db:5432/bcris
      POSTGRES_DB: bcris
      POSTGRES_USER: bcris_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      
      # Security (production için)
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    volumes:
      # Media dosyaları (yüklenen dosyalar)
      - media_data:/app/media
      # ML Model dosyaları
      - model_data:/app/models
      # Static dosyalar
      - static_data:/app/staticfiles
      # Loglar
      - log_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bcris_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  model_data:
    driver: local
  static_data:
    driver: local
  log_data:
    driver: local

networks:
  bcris_network:
    driver: bridge
