version: '3.8'

services:
  web:
    build: .
    container_name: bcris_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=bcris_project.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_DB=${POSTGRES_DB:-bcris}
      - POSTGRES_USER=${POSTGRES_USER:-bcris_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    volumes:
      # Veritabanı (SQLite kullanıyorsanız)
      - db_data:/app/db.sqlite3
      # Media dosyaları (yüklenen dosyalar)
      - media_data:/app/media
      # ML Model dosyaları
      - model_data:/app/models
      # Static dosyalar
      - static_data:/app/staticfiles
      # Loglar
      - log_data:/app/logs
    depends_on:
      - db
    networks:
      - bcris_network

  db:
    image: postgres:15-alpine
    container_name: bcris_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bcris}
      - POSTGRES_USER=${POSTGRES_USER:-bcris_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bcris_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcris_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local
  media_data:
    driver: local
  model_data:
    driver: local
  static_data:
    driver: local
  log_data:
    driver: local
  postgres_data:
    driver: local

networks:
  bcris_network:
    driver: bridge
